
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliothèque du Cluzeau</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f7f8;
    }
    h2 { color: #087e8b; }
    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
    }
    #result {
      font-size: 20px;
      font-weight: bold;
      margin: 20px;
    }
    input, button {
      font-size: 18px;
      padding: 12px;
      margin: 8px;
    }
  </style>
</head>
<body>
  <h2>Bibliothèque du Cluzeau</h2>

  <p>Accès réservé aux professeurs.</p>

  <input type="password" id="accessCode"
         placeholder="Code confidentiel">
  <button id="loginButton" onclick="connectLibrary()">
    Se connecter
  </button>

  <div id="studentArea" hidden>
  <p>Choisir l'élève :</p>
  <select id="studentSelect">
    <option value="">Sélectionner un élève</option>
  </select>
  <button onclick="startLoanSession()">
    Commencer les emprunts
  </button>
</div>
  
  <p id="instruction" hidden>
    Place le QR code du livre devant la caméra.
  </p>

  <div id="reader"></div>
  <div id="bookList"></div>

<button id="validateLoans" onclick="validateLoans()" hidden>
  Valider tous les emprunts
</button>
  <div id="result"></div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzftNyIqkjBs67nKROMNvMxDfnPuTNwQzn7_vjb2rcj2VEMmIIzI96kFK2P0Hw2g0Ekgg/exec";

    let accessCode = "";
    let students = [];
    let selectedBooks = [];
    let selectedStudentId = "";
    let scanner = null;

    function connectLibrary() {
      accessCode =
        document.getElementById("accessCode").value.trim();

      const result = document.getElementById("result");
      const button = document.getElementById("loginButton");

      if (!accessCode) {
        result.textContent = "Saisis le code confidentiel.";
        return;
      }

      button.disabled = true;
      result.textContent = "Vérification du code...";

      const script = document.createElement("script");

      window.handleLibraryLogin = function(data) {
        script.remove();
        delete window.handleLibraryLogin;
        button.disabled = false;

        if (!data.success) {
          result.textContent =
            data.message || "Code confidentiel incorrect.";
          return;
        }

        students = data.students || [];
const studentSelect = document.getElementById("studentSelect");

studentSelect.innerHTML =
  '<option value="">Sélectionner un élève</option>';

students.forEach(student => {
  const option = document.createElement("option");
  option.value = student.id;
  option.textContent =
    student.prenom + " " + student.nom +
    (student.classe ? " — " + student.classe : "");
  studentSelect.appendChild(option);
});

document.getElementById("studentArea").hidden = false;
        document.getElementById("accessCode").disabled = true;
        button.hidden = true;
        document.getElementById("instruction").hidden = false;

        result.textContent =
          "Connexion réussie. Ouverture de la caméra...";
        
function startLoanSession() {
  const select = document.getElementById("studentSelect");

  if (!select.value) {
    document.getElementById("result").textContent =
      "Choisis d'abord un élève.";
    return;
  }

  selectedStudentId = select.value;
  selectedBooks = [];

  document.getElementById("result").textContent =
    "Élève sélectionné. Tu peux scanner ses livres.";

  startScanner();
}
        startScanner();
      };

      script.onerror = function() {
        result.textContent =
          "Impossible de contacter la bibliothèque.";
        button.disabled = false;
        script.remove();
        delete window.handleLibraryLogin;
      };

      script.src =
        API_URL +
        "?action=getStudents" +
        "&pin=" + encodeURIComponent(accessCode) +
        "&callback=handleLibraryLogin";

      document.body.appendChild(script);
    }

    function startScanner() {
      if (typeof Html5Qrcode === "undefined") {
        document.getElementById("result").textContent =
          "Le scanner ne peut pas être chargé.";
        return;
      }

      scanner = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(cameras => {
        if (!cameras.length) {
          document.getElementById("result").textContent =
            "Aucune caméra détectée.";
          return;
        }

        const camera = cameras.find(c =>
          /back|arrière|environment/i.test(c.label)
        ) || cameras[cameras.length - 1];

        scanner.start(
          camera.id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess
        );
      }).catch(error => {
        document.getElementById("result").textContent =
          "Impossible d'accéder à la caméra : " + error;
      });
    }

   function onScanSuccess(code) {
  scanner.stop().then(() => {
    document.getElementById("result").textContent =
      "Recherche du livre " + code + "...";

    const script = document.createElement("script");

    window.handleBookSearch = function(data) {
      script.remove();
      delete window.handleBookSearch;

      if (data.found) {
        const alreadyAdded = selectedBooks.some(
          book => book.code === data.book.code
        );

        if (alreadyAdded) {
          document.getElementById("result").textContent =
            "Ce livre est déjà dans la liste.";
        } else {
          selectedBooks.push(data.book);

          const list = document.getElementById("bookList");
          list.innerHTML = "";

          selectedBooks.forEach(book => {
            const item = document.createElement("p");
            item.textContent =
              book.title + " — " + book.author +
              " (" + book.code + ")";
            list.appendChild(item);
          });

          document.getElementById("validateLoans").hidden = false;

          document.getElementById("result").textContent =
            "Livre ajouté ! Tu peux scanner le suivant.";
        }
      } else {
        document.getElementById("result").textContent =
          data.message || "Livre introuvable.";
      }

      Html5Qrcode.getCameras().then(cameras => {
        if (!cameras.length) return;

        const camera = cameras.find(c =>
          /back|arrière|environment/i.test(c.label)
        ) || cameras[cameras.length - 1];

        scanner.start(
          camera.id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess
        );
      }).catch(error => {
        document.getElementById("result").textContent =
          "Impossible de relancer la caméra : " + error;
      });
    };

    script.onerror = function() {
      document.getElementById("result").textContent =
        "Impossible de contacter la bibliothèque.";
      script.remove();
      delete window.handleBookSearch;
    };

    script.src =
      API_URL +
      "?action=searchBook" +
      "&code=" + encodeURIComponent(code) +
      "&pin=" + encodeURIComponent(accessCode) +
      "&callback=handleBookSearch";

    document.body.appendChild(script);
  });
}
function validateLoans() {
   alert("1 - Fonction démarrée");
  if (!selectedStudentId || selectedBooks.length === 0) {
    document.getElementById("result").textContent =
      "Choisis un élève et ajoute au moins un livre.";
    return;
  }

  const button = document.getElementById("validateLoans");
  button.disabled = true;

  let index = 0;
  let successCount = 0;
  const total = selectedBooks.length;

  document.getElementById("result").textContent =
    "Enregistrement des emprunts...";

  alert("2 - Élève et livres détectés");

  function sendNextLoan() {
    if (index >= total) {
      document.getElementById("result").textContent =
        successCount + " emprunt(s) enregistré(s) sur " + total + ".";

      selectedBooks = [];
      document.getElementById("bookList").innerHTML = "";
      button.hidden = true;
      button.disabled = false;
      return;
    }

    const book = selectedBooks[index];
    const callbackName = "handleLoanResult";

    const script = document.createElement("script");

    window[callbackName] = function(data) {
      script.remove();
      delete window[callbackName];

  if (data && data.success === true && data.data && data.data.code) {
  successCount++;
} else {
  document.getElementById("result").textContent =
    "Erreur : " + (data.message || "Emprunt non enregistré.");
  button.disabled = false;
  return;
}

      index++;
      sendNextLoan();
    };

    script.onerror = function() {
      script.remove();
      delete window[callbackName];

      document.getElementById("result").textContent =
        "Erreur lors de l'enregistrement du livre " + book.code +
        ". Arrêt de la validation. " + successCount +
        " emprunt(s) enregistré(s) sur " + total + ".";

      button.disabled = false;
    };

    script.src =
      API_URL +
      "?action=createLoan" +
      "&studentId=" + encodeURIComponent(selectedStudentId) +
      "&code=" + encodeURIComponent(book.code) +
      "&condition=" + encodeURIComponent(book.condition || "Bon état") +
      "&pin=" + encodeURIComponent(accessCode) +
      "&callback=" + callbackName;

    document.body.appendChild(script);
    alert("Demande envoyée à Google Sheets");
  }

  sendNextLoan();
}
  </script>
</body>
</html>
